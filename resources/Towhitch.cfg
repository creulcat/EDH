# Supported event names (use one per "name:" field):
#   JobCancelled       (aliases: job.cancelled, Canceljob)
#   JobDelivered       (aliases: job.delivered, Finishjob)
#   PlayerFined        (aliases: player.fined)
#   PlayerTollgatePaid (aliases: player.tollgate.paid)
#   PlayerUseFerry     (aliases: player.use.ferry)
#   PlayerUseTrain     (aliases: player.use.train)
#
# Supported placeholders in JSON file:
# --- General (from cached truck/job configuration) ---
# {truck}              Truck brand and model (from configuration events)
# {cargo}              Cargo name (from active job configuration)
#
# --- Job (from cached job configuration) ---
# {startingLocation}   Job source city
# {destination}        Job destination city
#
# --- JobCancelled (job.cancelled) ---
# {penalty}            Cancellation penalty amount (formatted currency)
#
# --- JobDelivered (job.delivered) ---
# {revenue}            Delivery revenue (formatted currency)
# {earnedXp}           XP earned from delivery
# {cargoDamage}        Cargo damage percentage (integer, e.g. 2%)
# {distanceDriven}     Distance driven for the job in km (integer)
# {deliveryTime}       Time spent on the job (formatted in-game duration)
# {autoparkUsed}       Whether auto-park was used (true/false)
# {autoloadUsed}       Whether auto-load was used (true/false)
#
# --- PlayerFined (player.fined) ---
# {offence}            Fine offence type
# {fineAmount}         Fine amount (formatted currency)
#
# --- PlayerTollgatePaid (player.tollgate.paid) ---
# {tollAmount}         Toll amount paid (formatted currency)
#
# --- PlayerUseFerry / PlayerUseTrain (player.use.ferry, player.use.train) ---
# {useAmount}          Ferry or train fare amount (formatted currency)
# {useStartingLocation}  Departure location name
# {useDestination}     Arrival location name
# {timestamp}          Current UTC timestamp in ISO 8601 format
#
# Currency symbol is read from the active profile's g_currency setting.
# Empty or missing placeholder values use the locale notAvailable text (default: -N/A-).
#
# Optional locale block for translated plugin output text.
# Built-in presets: en, nl, de, fr
# Individual keys override preset values when both are used.
#
# locale:
#     name: "nl"
#     notAvailable: "-n.v.t.-"
#     day: "dag"
#     days: "dagen"
#     hour: "uur"
#     hours: "uren"
#     minute: "minuut"
#     minutes: "minuten"

locale:
    name: "en"

event:
    name: "JobCancelled"
    webhookURL: "https://discord.com/api/webhooks/1234567890/abcdefghijklmnopqrstuvwxyz"
    jsonFile: "JobCancelled.json"

event:
    name: "JobDelivered"
    webhookURL: "https://discord.com/api/webhooks/1234567890/abcdefghijklmnopqrstuvwxyz"
    jsonFile: "JobDelivered.json"

event:
    name: "PlayerFined"
    webhookURL: "https://discord.com/api/webhooks/1234567890/abcdefghijklmnopqrstuvwxyz"
    jsonFile: "PlayerFined.json"

event:
    name: "PlayerTollgatePaid"
    webhookURL: "https://discord.com/api/webhooks/1234567890/abcdefghijklmnopqrstuvwxyz"
    jsonFile: "PlayerTollgatePaid.json"

event:
    name: "PlayerUseFerry"
    webhookURL: "https://discord.com/api/webhooks/1234567890/abcdefghijklmnopqrstuvwxyz"
    jsonFile: "PlayerUseFerry.json"

event:
    name: "PlayerUseTrain"
    webhookURL: "https://discord.com/api/webhooks/1234567890/abcdefghijklmnopqrstuvwxyz"
    jsonFile: "PlayerUseTrain.json"
